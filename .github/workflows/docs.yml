# GitHub Actions workflow for building and deploying Sphinx documentation
# Documentation will be available at: https://<username>.github.io/prevcarga/

name: Deploy Documentation

on:
  # Runs on pushes targeting the main branch
  push:
    branches: ["main"]
    paths:
      - "docs/**"
      - "src/**"
      - ".github/workflows/docs.yml"

  # Allows manual triggering from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Build job
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,docs]"

      - name: Build Sphinx documentation
        run: |
          cd docs/sphinx
          make html
        env:
          # Suppress autodoc import warnings in CI
          SPHINX_APIDOC_OPTIONS: "members,undoc-members,show-inheritance"

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/sphinx/build/html

  # Deployment job
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
